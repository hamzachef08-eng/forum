services:
  db:
    image: mysql:8.4
    container_name: forum-db
    command: --mysql-native-password=ON
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: est_forum
      MYSQL_USER: forum_user
      MYSQL_PASSWORD: forum_pass_change_me
      MYSQL_ROOT_PASSWORD: root_pass_change_me
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forum-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      DB_URL: jdbc:mysql://db:3306/est_forum?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USER: forum_user
      DB_PASSWORD: forum_pass_change_me
    ports:
      - "8080:8080"

volumes:
  db_data:
